<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Material Hunt - Spin The Wheel</title>
  
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Rye&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-dark: #070c18;
      --gold-primary: #f5b324;
      --accent-red: #ea384c;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(59, 130, 246, 0.22) 0%, transparent 65%),
        radial-gradient(rgba(245, 179, 36, 0.18) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 26px 26px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      color: #fff;
    }

    /* Radiant, Glowing 24K Gold 3D Carnival Title */
    .carnival-title-vibrant {
      font-family: 'Rye', serif;
      letter-spacing: 4px;
      background: linear-gradient(180deg, #ffffff 0%, #fff4a3 25%, #ffc83b 55%, #f59e0b 80%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 0 #5b3000) 
              drop-shadow(0 6px 1px #2a1400) 
              drop-shadow(0 0 25px rgba(255, 193, 7, 0.9)) 
              drop-shadow(0 0 50px rgba(245, 158, 11, 0.5));
    }

    .wheel-bezel {
      background: radial-gradient(circle, #5a380e 0%, #2b1803 100%);
      border: 14px solid #caa048;
      box-shadow: 
        inset 0 0 25px rgba(0, 0, 0, 0.95),
        0 0 0 5px #6e4b14,
        0 0 45px rgba(245, 179, 36, 0.45),
        0 25px 50px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    .marquee-bulb {
      position: absolute;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #ffeb99 40%, #e09612 100%);
      box-shadow: 0 0 10px #ffe585, 0 0 22px #f5a623;
      transform: translate(-50%, -50%);
      z-index: 25;
      transition: all 0.2s ease;
    }

    .crt-monitor {
      background: #090e1a;
      border: 4px solid #1e293b;
      border-radius: 16px;
      box-shadow: 
        inset 0 0 18px rgba(0, 0, 0, 0.95),
        0 14px 28px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .led-text {
      font-family: 'Orbitron', monospace;
      text-shadow: 0 0 14px rgba(234, 56, 76, 0.85), 0 0 26px rgba(234, 56, 76, 0.5);
    }

    .target-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
      position: relative;
    }

    .target-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 9px;
      background: linear-gradient(90deg, #ea384c, #f59e0b);
      border-radius: 24px 24px 0 0;
    }
  </style>
</head>
<body class="flex flex-col justify-between p-4 md:p-6 lg:p-8">

  <!-- Floating Controls -->
  <div class="fixed top-5 right-5 z-50 flex items-center gap-3">
    <button id="soundToggleBtn" class="w-11 h-11 rounded-full bg-slate-900/80 border border-slate-700/80 flex items-center justify-center text-slate-300 hover:text-white backdrop-blur shadow-lg transition active:scale-95" title="Toggle Sound">
      <span id="soundIcon">🔊</span>
    </button>
    <button id="tasksBtn" class="w-11 h-11 rounded-full bg-slate-900/80 border border-slate-700/80 flex items-center justify-center text-slate-300 hover:text-white backdrop-blur shadow-lg transition active:scale-95" title="All Tasks Checklist">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>

  <!-- Giant Header: Big MIB Logo + Radiant Gold Title -->
  <header class="w-full flex flex-col items-center justify-center mb-6 text-center select-none">
    
    <!-- Huge MIB Lion Logo -->
    <div class="w-full flex items-center justify-center mb-3">
      <img 
        id="mainLogo"
        src="./MIB LOGO MAIN.webp" 
        onerror="this.onerror=null; this.src='./logo.png'; this.onerror=function(){this.src='./logo.jpg';};" 
        alt="Make In BVB Lion Logo" 
        class="w-64 sm:w-80 md:w-[460px] lg:w-[560px] max-h-56 object-contain filter drop-shadow-[0_0_30px_rgba(245,179,36,0.35)] transition-transform duration-300 hover:scale-105"
      />
    </div>

    <!-- Glowing 24K Gold Title -->
    <h1 class="carnival-title-vibrant text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-black uppercase tracking-wider py-1">
      SPIN THE WHEEL
    </h1>

    <!-- Subtitle Badge -->
    <div class="inline-flex items-center gap-2 mt-2 px-5 py-1.5 rounded-full bg-amber-500/10 border border-amber-400/30 backdrop-blur-sm">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
      <p class="text-amber-300 font-extrabold tracking-[0.25em] text-xs sm:text-sm uppercase">
        Make In BVB • Inspiring Minds To Innovate
      </p>
    </div>
  </header>

  <!-- Landscape Layout (Left: Giant Wheel & CRT Timer, Right: Challenge Card) -->
  <main class="max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center flex-1 my-auto">
    
    <!-- LEFT: Giant Wheel & Timer -->
    <section class="lg:col-span-6 flex flex-col items-center justify-center relative">
      
      <div class="relative flex items-center justify-center">
        <!-- Top Pointer Needle -->
        <div class="absolute -top-7 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center pointer-events-none filter drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)]">
          <div class="w-0 h-0 border-l-[18px] border-l-transparent border-r-[18px] border-r-transparent border-t-[34px] border-t-amber-400"></div>
          <div class="w-3.5 h-3.5 rounded-full bg-red-600 border-2 border-white -mt-1 shadow-md"></div>
        </div>

        <!-- Wheel Rim & Canvas -->
        <div id="wheelContainer" class="wheel-bezel rounded-full p-2 relative w-[340px] h-[340px] sm:w-[420px] sm:h-[420px] md:w-[470px] md:h-[470px] xl:w-[510px] xl:h-[510px] flex items-center justify-center cursor-pointer select-none">
          <div id="bulbsContainer" class="absolute inset-0 pointer-events-none"></div>
          <canvas id="wheelCanvas" width="800" height="800" class="w-full h-full rounded-full"></canvas>

          <!-- Center Gold Hub -->
          <div id="centerSpinHub" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-b from-amber-300 via-amber-500 to-amber-700 border-4 border-yellow-200 shadow-[0_0_20px_rgba(0,0,0,0.8)] flex items-center justify-center z-20 hover:scale-105 active:scale-95 transition">
            <span class="text-slate-900 text-2xl sm:text-3xl font-black">★</span>
          </div>
        </div>
      </div>

      <!-- Retro CRT Digital Countdown Monitor -->
      <div class="relative mt-8 flex flex-col items-center">
        <div class="flex justify-between w-28 -mb-1 opacity-70 pointer-events-none">
          <div class="w-0.5 h-7 bg-slate-400 rotate-[-35deg] origin-bottom-right"></div>
          <div class="w-0.5 h-7 bg-slate-400 rotate-[35deg] origin-bottom-left"></div>
        </div>

        <div class="crt-monitor px-7 py-3 flex items-center justify-between gap-6 min-w-[240px]">
          <div>
            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest" id="timerLabel">TIME LEFT</div>
            <div id="timerDisplay" class="led-text text-3xl sm:text-4xl font-extrabold text-red-500">45<span class="text-xl">s</span></div>
          </div>
          <div class="flex items-center gap-1.5">
            <span id="dot1" class="w-2.5 h-2.5 rounded-full bg-red-600 animate-pulse"></span>
            <span id="dot2" class="w-2.5 h-2.5 rounded-full bg-slate-700"></span>
            <span id="dot3" class="w-2.5 h-2.5 rounded-full bg-slate-700"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- RIGHT: Challenge Card & Controls -->
    <section class="lg:col-span-6 flex flex-col items-center justify-center max-w-lg mx-auto w-full">
      
      <!-- Target Challenge Card -->
      <div id="targetCard" class="target-card w-full p-6 sm:p-8 text-slate-900 transition-all duration-300">
        
        <div class="absolute -top-3 -right-3 w-8 h-8 rounded-lg bg-amber-400 border border-amber-200 shadow-md flex items-center justify-center text-slate-900 font-bold rotate-12">
          ✦
        </div>

        <div class="text-center mb-4">
          <div id="cardStatusBadge" class="text-xs font-black uppercase tracking-widest text-amber-600">
            READY TO PLAY?
          </div>
        </div>

        <div id="challengeBox" class="border-2 border-dashed border-slate-300 rounded-xl p-5 sm:p-6 bg-slate-50/70 text-center min-h-[170px] flex flex-col items-center justify-center transition-all">
          <div id="challengeIcon" class="text-3xl mb-2">🎲</div>
          <div id="challengeSubtitle" class="text-xs uppercase font-extrabold tracking-wider text-slate-400 mb-1">
            STATUS: STANDBY
          </div>
          <h2 id="challengeTitle" class="text-xl sm:text-2xl font-black text-slate-800 leading-snug">
            Spin the wheel to reveal your next challenge!
          </h2>
          <div id="itemTag" class="hidden mt-3 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold">
            Target Challenge
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-6 flex flex-col gap-3">
          <button id="mainActionBtn" class="w-full py-4 px-6 rounded-xl font-extrabold text-base sm:text-lg bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 text-slate-950 shadow-lg shadow-amber-500/30 hover:brightness-105 active:scale-[0.98] transition flex items-center justify-center gap-2">
            <span>🎲</span>
            <span id="btnText">SPIN WHEEL TO START</span>
          </button>

          <button id="resetGameBtn" class="py-2 text-xs font-bold tracking-widest uppercase text-slate-400 hover:text-slate-600 transition flex items-center justify-center gap-1.5">
            <span>↺</span> RESET GAME
          </button>
        </div>
      </div>

      <!-- Bottom Progress Bar -->
      <div class="mt-6 w-full flex items-center justify-between px-6 py-3 rounded-full bg-slate-900/90 border border-slate-800 shadow-xl text-xs font-bold tracking-wider">
        <div class="flex items-center gap-2 text-amber-400">
          <span>🏆</span>
          <span class="text-slate-400">FOUND:</span>
          <span id="foundProgress" class="text-white font-extrabold text-sm">0 / 10</span>
        </div>
        <div class="flex items-center gap-2 text-amber-300">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
          <span>MAKE IN BVB</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Tasks Checklist Modal -->
  <div id="tasksModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 max-w-md w-full rounded-2xl p-6 text-white shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="font-extrabold text-lg text-amber-400 flex items-center gap-2">
          <span>📋</span> Hunt Checklist (10 Items)
        </h3>
        <button id="closeTasksBtn" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center">✕</button>
      </div>
      <div id="tasksList" class="divide-y divide-slate-800 overflow-y-auto my-3 flex-1 pr-1 text-sm"></div>
      <div class="pt-3 border-t border-slate-800 flex justify-end">
        <button id="doneTasksBtn" class="px-5 py-2 rounded-xl bg-amber-500 font-bold text-slate-950 text-xs">CLOSE</button>
      </div>
    </div>
  </div>

  <script>
    const HUNT_ITEMS = [
      { id: 1, title: "Bring 3 diff wires of charging like c, normal, phone", color: "#e62238", label: "MIB 1" },
      { id: 2, title: "Bring 5 different shapes of leaves", color: "#1447e6", label: "Magic 2" },
      { id: 3, title: "Collect and bring breadboard and wires", color: "#eab308", label: "Secret 3" },
      { id: 4, title: "Find a pair of adidas shoe", color: "#16a34a", label: "MIB 4" },
      { id: 5, title: "Find 3 diff shape obj of 3 diff colours", color: "#f97316", label: "Hidden 5" },
      { id: 6, title: "Collect and bring cards", color: "#8b5cf6", label: "Magic 6" },
      { id: 7, title: "Collect and bring pendrive min 2", color: "#ec4899", label: "Mystery 7" },
      { id: 8, title: "Find 3 different coins — each with a different year or value", color: "#06b6d4", label: "MIB 8" },
      { id: 9, title: "Find something circular but not a coin", color: "#f43f5e", label: "Win 9" },
      { id: 10, title: "Find 3 diff stationary items -- highlighter, paper clip, sticky notes", color: "#10b981", label: "Lucky 10" }
    ];

    let items = JSON.parse(JSON.stringify(HUNT_ITEMS));
    let currentAngle = 0;
    let isSpinning = false;
    let selectedItem = null;
    let gameState = "IDLE";
    let timerDuration = 45;
    let timerRemaining = 45;
    let timerInterval = null;
    let soundEnabled = true;

    // Web Audio Synthesizer
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(650, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch(e) {}
    }

    function playFanfare() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        [440, 554, 659, 880].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.09 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.09);
          osc.stop(ctx.currentTime + idx * 0.09 + 0.35);
        });
      } catch(e) {}
    }

    // Canvas Wheel
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");

    function drawWheel() {
      const centerX = 400;
      const centerY = 400;
      const radius = 370;
      const numSlices = items.length;
      const arc = (2 * Math.PI) / numSlices;

      ctx.clearRect(0, 0, 800, 800);

      items.forEach((item, i) => {
        const angle = currentAngle + i * arc;
        
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + arc);
        ctx.closePath();

        ctx.fillStyle = item.completed ? "#334155" : item.color;
        ctx.fill();

        ctx.strokeStyle = "#caa048";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";

        if (item.completed) {
          ctx.fillStyle = "#94a3b8";
          ctx.font = "bold 42px Plus Jakarta Sans, sans-serif";
          ctx.fillText("✓", radius - 60, 0);
        } else {
          ctx.fillStyle = "#ffffff";
          ctx.font = "900 24px Plus Jakarta Sans, sans-serif";
          ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
          ctx.shadowBlur = 6;
          ctx.fillText(item.label, radius - 45, 0);
        }

        ctx.restore();
        ctx.restore();
      });

      // Outer inner border
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.strokeStyle = "#eab308";
      ctx.lineWidth = 8;
      ctx.stroke();
    }

    function createMarqueeBulbs() {
      const bulbsContainer = document.getElementById("bulbsContainer");
      bulbsContainer.innerHTML = "";
      const totalBulbs = 16;
      for (let i = 0; i < totalBulbs; i++) {
        const angle = (i / totalBulbs) * (2 * Math.PI);
        const bulb = document.createElement("div");
        bulb.className = "marquee-bulb";
        bulb.style.left = `${50 + 49 * Math.cos(angle)}%`;
        bulb.style.top = `${50 + 49 * Math.sin(angle)}%`;
        bulbsContainer.appendChild(bulb);
      }
    }

    function spinWheel() {
      if (isSpinning) return;
      const uncompleted = items.filter(it => !it.completed);
      if (uncompleted.length === 0) {
        alert("All 10 challenges are already completed!");
        return;
      }

      isSpinning = true;
      gameState = "SPINNING";
      clearInterval(timerInterval);

      document.getElementById("cardStatusBadge").innerText = "SPINNING...";
      document.getElementById("cardStatusBadge").className = "text-xs font-black uppercase tracking-widest text-amber-500 animate-pulse";
      document.getElementById("challengeIcon").innerText = "⚙️";
      document.getElementById("challengeSubtitle").innerText = "CHOOSING TARGET...";
      document.getElementById("challengeTitle").innerText = "Selecting your next material hunt challenge...";
      document.getElementById("itemTag").classList.add("hidden");
      document.getElementById("mainActionBtn").disabled = true;
      document.getElementById("mainActionBtn").classList.add("opacity-60", "cursor-not-allowed");

      const targetItem = uncompleted[Math.floor(Math.random() * uncompleted.length)];
      const targetIndex = items.findIndex(it => it.id === targetItem.id);
      const arc = (2 * Math.PI) / items.length;

      const targetAngleCenter = -(targetIndex * arc + arc / 2) - Math.PI / 2;
      const spins = 5 + Math.floor(Math.random() * 3);
      const targetTotalAngle = currentAngle + (spins * 2 * Math.PI) + ((targetAngleCenter - (currentAngle % (2 * Math.PI)) + 4 * Math.PI) % (2 * Math.PI));

      const startAngle = currentAngle;
      const deltaAngle = targetTotalAngle - startAngle;
      const duration = 4200;
      const startTime = performance.now();
      let lastTickAngle = currentAngle;

      function animateSpin(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + deltaAngle * ease;
        drawWheel();

        if (Math.abs(currentAngle - lastTickAngle) > arc) {
          playTick();
          lastTickAngle = currentAngle;
        }

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          isSpinning = false;
          selectedItem = targetItem;
          onSpinComplete();
        }
      }

      requestAnimationFrame(animateSpin);
    }

    function onSpinComplete() {
      gameState = "HUNTING";
      playFanfare();

      document.getElementById("cardStatusBadge").innerText = "TARGET ACQUIRED";
      document.getElementById("cardStatusBadge").className = "text-xs font-black uppercase tracking-widest text-red-600";
      document.getElementById("challengeIcon").innerText = "🎯";
      document.getElementById("challengeSubtitle").innerText = `FIND: ${selectedItem.label}`;
      document.getElementById("challengeTitle").innerText = selectedItem.title;
      
      const itemTag = document.getElementById("itemTag");
      itemTag.innerText = `Challenge #${selectedItem.id}`;
      itemTag.classList.remove("hidden");

      const btn = document.getElementById("mainActionBtn");
      btn.disabled = false;
      btn.classList.remove("opacity-60", "cursor-not-allowed");
      btn.className = "w-full py-4 px-6 rounded-xl font-extrabold text-base sm:text-lg bg-gradient-to-r from-emerald-500 to-green-600 text-white shadow-lg shadow-green-500/30 hover:brightness-105 active:scale-[0.98] transition flex items-center justify-center gap-2";
      document.getElementById("btnText").innerText = "I FOUND THIS ITEM!";

      startCountdown();
    }

    function startCountdown() {
      clearInterval(timerInterval);
      timerRemaining = timerDuration;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timerRemaining--;
        if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          timerRemaining = 0;
          updateTimerDisplay();
          onTimeExpired();
        } else {
          updateTimerDisplay();
          if (timerRemaining <= 5) playTick();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const display = document.getElementById("timerDisplay");
      display.innerHTML = `${timerRemaining}<span class="text-xl">s</span>`;
      display.className = timerRemaining <= 10 
        ? "led-text text-3xl sm:text-4xl font-extrabold text-red-500 animate-pulse" 
        : "led-text text-3xl sm:text-4xl font-extrabold text-red-500";
    }

    function onTimeExpired() {
      playTick();
      document.getElementById("cardStatusBadge").innerText = "TIME EXPIRED!";
      document.getElementById("cardStatusBadge").className = "text-xs font-black uppercase tracking-widest text-slate-500";
      const btn = document.getElementById("mainActionBtn");
      btn.className = "w-full py-4 px-6 rounded-xl font-extrabold text-base sm:text-lg bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 text-slate-950 shadow-lg shadow-amber-500/30 hover:brightness-105 active:scale-[0.98] transition flex items-center justify-center gap-2";
      document.getElementById("btnText").innerText = "SPIN AGAIN";
    }

    function claimFoundItem() {
      if (!selectedItem) return;
      clearInterval(timerInterval);

      const itemRef = items.find(it => it.id === selectedItem.id);
      if (itemRef) itemRef.completed = true;

      drawWheel();
      updateProgress();

      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });

      const remaining = items.filter(it => !it.completed).length;
      if (remaining === 0) {
        document.getElementById("cardStatusBadge").innerText = "CONGRATULATIONS!";
        document.getElementById("challengeTitle").innerText = "🎉 All 10 challenges completed!";
        document.getElementById("btnText").innerText = "HUNT COMPLETED!";
        document.getElementById("mainActionBtn").disabled = true;
      } else {
        document.getElementById("cardStatusBadge").innerText = "TASK COMPLETED!";
        document.getElementById("challengeIcon").innerText = "✨";
        document.getElementById("challengeTitle").innerText = `Great job finding "${selectedItem.label}"! Ready for the next one?`;
        
        const btn = document.getElementById("mainActionBtn");
        btn.className = "w-full py-4 px-6 rounded-xl font-extrabold text-base sm:text-lg bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 text-slate-950 shadow-lg shadow-amber-500/30 hover:brightness-105 active:scale-[0.98] transition flex items-center justify-center gap-2";
        document.getElementById("btnText").innerText = "SPIN FOR NEXT ITEM";
      }

      selectedItem = null;
    }

    function updateProgress() {
      const count = items.filter(it => it.completed).length;
      document.getElementById("foundProgress").innerText = `${count} / ${items.length}`;
    }

    function resetGame() {
      if (isSpinning) return;
      clearInterval(timerInterval);
      items = JSON.parse(JSON.stringify(HUNT_ITEMS));
      selectedItem = null;
      gameState = "IDLE";
      timerRemaining = timerDuration;

      updateTimerDisplay();
      updateProgress();
      drawWheel();

      document.getElementById("cardStatusBadge").innerText = "READY TO PLAY?";
      document.getElementById("cardStatusBadge").className = "text-xs font-black uppercase tracking-widest text-amber-600";
      document.getElementById("challengeIcon").innerText = "🎲";
      document.getElementById("challengeSubtitle").innerText = "STATUS: STANDBY";
      document.getElementById("challengeTitle").innerText = "Spin the wheel to reveal your next challenge!";
      document.getElementById("itemTag").classList.add("hidden");

      const btn = document.getElementById("mainActionBtn");
      btn.disabled = false;
      btn.className = "w-full py-4 px-6 rounded-xl font-extrabold text-base sm:text-lg bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 text-slate-950 shadow-lg shadow-amber-500/30 hover:brightness-105 active:scale-[0.98] transition flex items-center justify-center gap-2";
      document.getElementById("btnText").innerText = "SPIN WHEEL TO START";
    }

    function renderTasksList() {
      const container = document.getElementById("tasksList");
      container.innerHTML = "";
      items.forEach((it) => {
        const div = document.createElement("div");
        div.className = "py-2.5 flex items-start justify-between gap-3";
        div.innerHTML = `
          <div class="flex items-start gap-2.5">
            <span class="${it.completed ? 'text-emerald-400 font-bold' : 'text-slate-500'}">
              ${it.completed ? '✓' : '○'}
            </span>
            <span class="${it.completed ? 'line-through text-slate-500' : 'text-slate-200 font-medium'}">
              ${it.id}. ${it.title}
            </span>
          </div>
          <span class="text-xs px-2 py-0.5 rounded ${it.completed ? 'bg-emerald-950 text-emerald-400' : 'bg-slate-800 text-slate-400'}">
            ${it.label}
          </span>
        `;
        container.appendChild(div);
      });
    }

    // Event Bindings
    document.getElementById("mainActionBtn").addEventListener("click", () => {
      if (gameState === "HUNTING" && selectedItem) {
        claimFoundItem();
      } else {
        spinWheel();
      }
    });

    document.getElementById("centerSpinHub").addEventListener("click", spinWheel);
    document.getElementById("wheelCanvas").addEventListener("click", () => {
      if (!isSpinning && gameState !== "HUNTING") spinWheel();
    });

    document.getElementById("resetGameBtn").addEventListener("click", resetGame);

    document.getElementById("soundToggleBtn").addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      document.getElementById("soundIcon").innerText = soundEnabled ? "🔊" : "🔇";
    });

    document.getElementById("tasksBtn").addEventListener("click", () => {
      renderTasksList();
      document.getElementById("tasksModal").classList.remove("hidden");
    });

    document.getElementById("closeTasksBtn").addEventListener("click", () => {
      document.getElementById("tasksModal").classList.add("hidden");
    });

    document.getElementById("doneTasksBtn").addEventListener("click", () => {
      document.getElementById("tasksModal").classList.add("hidden");
    });

    window.addEventListener("DOMContentLoaded", () => {
      createMarqueeBulbs();
      resetGame();
    });
  </script>
</body>
</html>
